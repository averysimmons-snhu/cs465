<div class="card shadow-sm col-12 col-md-8 col-lg-6">
  <div class="card-body">
    <h2 class="mb-2">Edit Trip</h2>
    <p class="text-muted">{{ message }}</p>
    <form *ngIf="editForm" [formGroup]="editForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Code:</label>
        <input type="text" formControlName="code" class="form-control" readonly>
      </div>

      <div class="form-group">
        <label>Name:</label>
        <input type="text" formControlName="name" class="form-control">
        <div *ngIf="submitted && f['name'].errors" class="text-danger">Name is required</div>
      </div>

      <div class="form-group">
        <label>Length:</label>
        <input type="text" formControlName="length" class="form-control">
        <div *ngIf="submitted && f['length'].errors" class="text-danger">Length is required</div>
      </div>

      <div class="form-group">
        <label>Start:</label>
        <input type="date" formControlName="start" class="form-control">
        <div *ngIf="submitted && f['start'].errors" class="text-danger">Start date is required</div>
      </div>

      <div class="form-group">
        <label>Resort:</label>
        <input type="text" formControlName="resort" class="form-control">
        <div *ngIf="submitted && f['resort'].errors" class="text-danger">Resort is required</div>
      </div>

      <div class="form-group">
        <label>Per Person:</label>
        <input type="text" formControlName="perPerson" class="form-control">
        <div *ngIf="submitted && f['perPerson'].errors" class="text-danger">Price is required</div>
      </div>

      <div class="form-group">
        <label>Image Name:</label>
        <input type="text" formControlName="image" class="form-control">
        <div *ngIf="submitted && f['image'].errors" class="text-danger">Image name is required</div>
      </div>

      <div class="form-group">
        <label>Description:</label>
        <textarea formControlName="description" class="form-control" rows="4"></textarea>
        <div *ngIf="submitted && f['description'].errors" class="text-danger">Description is required</div>
      </div>

      <button type="submit" class="btn btn-primary me-2">Update</button>
      <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
    </form>
  </div>
</div>
