<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="mb-3">Admin Login</h2>
        <div role="alert" *ngIf="formError" class="alert alert-danger">
          {{ formError }}
        </div>
        <form (ngSubmit)="onLoginSubmit()">
          <div class="form-group mb-3">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" [(ngModel)]="credentials.email">
          </div>
          <div class="form-group mb-3">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" [(ngModel)]="credentials.password">
          </div>
          <button type="submit" class="btn btn-primary">Log In</button>
        </form>
      </div>
    </div>
  </div>
</div>
