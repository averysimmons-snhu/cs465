<div class="d-flex justify-content-between align-items-center mb-3">
  <div>
    <h2>Trip Listing</h2>
    <p class="text-muted">{{ message }}</p>
  </div>
  <button class="btn btn-success" (click)="addTrip()">Add Trip</button>
</div>

<div class="row g-3">
  <div *ngFor="let trip of trips" class="col-12 col-md-4">
    <app-trip-card [trip]="trip" (deleteRequested)="deleteTrip($event)"></app-trip-card>
  </div>
</div>
